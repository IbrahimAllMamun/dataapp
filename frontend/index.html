<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Litigation Cases</title>

    <!--
      The IDLC mark on a light tile, mirroring .brand-mark in the app. The
      artwork is the same geometry as LogoMark in icons.jsx, scaled out of its
      ~58 unit square into a 32px tile (translate 5, scale 22/58.32).
      The tile is drawn rather than left transparent so the black brackets
      still read when a browser puts the favicon on dark tab chrome.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='.5' y='.5' width='31' height='31' rx='7.5' fill='%23fff' stroke='%23e7e4e5'/%3E%3Cg transform='translate(5 5) scale(.3772)'%3E%3Cpath fill='%23ED1C24' d='M0 15.05H43.22V58.34H0Z'/%3E%3Cpath fill='%23171314' d='M50.75 7.51H21.94V11.31H47.02V36.43H50.75Z'/%3E%3Cpath fill='%23171314' d='M58.28 .03H36.67V3.77H54.55V21.61H58.28Z'/%3E%3C/g%3E%3C/svg%3E"
    />

    <!-- Theme is stamped before first paint so the page never flashes light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
