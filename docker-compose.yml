services:
  db:
    image: postgres:16-alpine
    command: postgres -c timezone=Asia/Dhaka -c log_timezone=Asia/Dhaka
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Dhaka
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host side only. The postgres image ignores POSTGRES_PORT and always
      # listens on 5432 inside, so the container side must stay 5432 — mapping
      # it to ${POSTGRES_PORT} on both sides points at nothing the moment that
      # is not 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    

  api:
    build: ./backend
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      TZ: Asia/Dhaka
      API_PORT: ${API_PORT}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      TZ: Asia/Dhaka
      FRONTEND_PORT: ${FRONTEND_PORT}
      API_PORT: ${API_PORT}
    depends_on:
      - api

volumes:
  pgdata: